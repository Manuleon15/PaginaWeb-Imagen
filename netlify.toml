# Configuración de Netlify — imagenmadrid.es
[build]
  publish = "."
  command = "echo 'Sitio estático, sin build step'"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"

[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/home"
  to = "/"
  status = 301

[[redirects]]
  from = "/inicio"
  to = "/"
  status = 301

[[redirects]]
  from = "http://*"
  to = "https://:splat"
  status = 301
  force = true

