# Workflow de validación para Peluquería Imagen Madrid
# El despliegue real lo gestiona Netlify mediante integración Git (netlify.toml).
# Este workflow SOLO valida: archivos sucios, HTML, sitemap y SEO básico.
# No requiere secrets ni acciones de terceros adicionales.

name: Build & Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    name: Validación HTML, SEO y repo
    runs-on: ubuntu-latest

    steps:
      # ── 1. Clonar el repositorio ────────────────────────────────────────────
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      # ── 2. Detectar archivos sucios (macOS / IDEs) ──────────────────────────
      - name: Comprobar archivos no deseados (.DS_Store, .idea)
        run: |
          echo "🔍 Buscando archivos no deseados en el repositorio..."

          FOUND=0

          # Buscar .DS_Store en todo el árbol
          if find . -name ".DS_Store" | grep -q .; then
            echo "❌ Se encontraron archivos .DS_Store:"
            find . -name ".DS_Store"
            FOUND=1
          fi

          # Buscar directorio .idea (IntelliJ / WebStorm)
          if find . -type d -name ".idea" | grep -q .; then
            echo "❌ Se encontró el directorio .idea:"
            find . -type d -name ".idea"
            FOUND=1
          fi

          if [ "$FOUND" -eq 1 ]; then
            echo ""
            echo "💡 Añade estas entradas a .gitignore y elimínalos del índice:"
            echo "   git rm -r --cached .DS_Store .idea"
            exit 1
          fi

          echo "✅ No se encontraron archivos no deseados."

      # ── 3. Validar HTML con html5validator (opcional, no bloquea) ───────────
      - name: Validar HTML con html5validator
        run: |
          echo "🔍 Intentando validar HTML con html5validator..."

          # Instalamos html5validator sin guardarlo en package.json.
          # Si npm o el paquete no están disponibles, simplemente lo omitimos.
          if npm install html5validator --no-save 2>/dev/null; then
            echo "📦 html5validator instalado. Ejecutando validación..."

            # Ejecutamos el validador sobre todos los .html del repo.
            # --also-check-css activa también CSS si está disponible.
            # Si el validador falla, informamos pero NO rompemos el build.
            if npx html5validator --root . --also-check-css \
                 --ignore "Error: Start tag seen without seeing a doctype first" \
                 2>&1; then
              echo "✅ Validación HTML completada sin errores."
            else
              echo "⚠️  html5validator reportó advertencias o errores."
              echo "    Revisa la salida anterior, pero el build continúa."
            fi
          else
            echo "⚠️  No se pudo instalar html5validator. Se omite esta validación."
          fi

      # ── 4. Validar sitemap.xml con Python 3 ────────────────────────────────
      - name: Validar sitemap.xml
        run: |
          echo "🔍 Validando sitemap.xml..."

          SITEMAP=$(find . -maxdepth 3 -name "sitemap.xml" | head -1)

          if [ -z "$SITEMAP" ]; then
            echo "⚠️  No se encontró sitemap.xml en el repositorio."
            echo "    Se recomienda tenerlo para mejorar el SEO."
            exit 0   # Advertencia, no error crítico
          fi

          echo "📄 Sitemap encontrado en: $SITEMAP"

          # Comprobamos que el XML esté bien formado con Python estándar
          python3 - <<'PYEOF'
          import xml.etree.ElementTree as ET
          import sys

          sitemap_path = None
          import subprocess, os

          result = subprocess.run(
              ["find", ".", "-maxdepth", "3", "-name", "sitemap.xml"],
              capture_output=True, text=True
          )
          sitemap_path = result.stdout.strip().split("\n")[0]

          if not sitemap_path:
              print("⚠️  sitemap.xml no encontrado desde Python.")
              sys.exit(0)

          try:
              tree = ET.parse(sitemap_path)
              root = tree.getroot()
              # Contamos las URLs declaradas en el sitemap
              ns = {"sm": "http://www.sitemaps.org/schemas/sitemap/0.9"}
              urls = root.findall(".//sm:url", ns) or root.findall(".//url")
              print(f"✅ sitemap.xml válido — {len(urls)} URL(s) encontrada(s).")
          except ET.ParseError as e:
              print(f"❌ sitemap.xml tiene errores de formato XML: {e}")
              sys.exit(1)
          PYEOF

      # ── 5. Checks SEO básicos en index.html ─────────────────────────────────
      - name: Checks SEO (canonical, JSON-LD, og:image)
        run: |
          echo "🔍 Comprobando elementos SEO en index.html..."

          INDEX=$(find . -maxdepth 3 -name "index.html" | head -1)

          if [ -z "$INDEX" ]; then
            echo "❌ No se encontró index.html. ¿Está en la raíz del proyecto?"
            exit 1
          fi

          echo "📄 Analizando: $INDEX"
          ERRORS=0

          # ── 5a. Etiqueta canonical ──────────────────────────────────────────
          if grep -qi 'rel=["\x27]canonical["\x27]' "$INDEX"; then
            echo "✅ Etiqueta canonical encontrada."
          else
            echo "❌ Falta etiqueta <link rel=\"canonical\" ...> en index.html."
            ERRORS=$((ERRORS + 1))
          fi

          # ── 5b. JSON-LD (datos estructurados) ──────────────────────────────
          if grep -q 'application/ld+json' "$INDEX"; then
            echo "✅ Bloque JSON-LD (datos estructurados) encontrado."
          else
            echo "❌ No se encontró <script type=\"application/ld+json\"> en index.html."
            ERRORS=$((ERRORS + 1))
          fi

          # ── 5c. og:image (Open Graph para redes sociales) ──────────────────
          if grep -qi 'og:image' "$INDEX"; then
            echo "✅ Meta tag og:image encontrada."
          else
            echo "❌ Falta <meta property=\"og:image\" ...> en index.html."
            ERRORS=$((ERRORS + 1))
          fi

          # ── Resultado final ─────────────────────────────────────────────────
          if [ "$ERRORS" -gt 0 ]; then
            echo ""
            echo "⚠️  Se encontraron $ERRORS problema(s) de SEO. Corrígelos para mejorar"
            echo "    el posicionamiento en buscadores."
            # Los avisos SEO no rompen el build; cambia 'exit 0' a 'exit 1'
            # si quieres que sean bloqueantes.
            exit 0
          fi

          echo ""
          echo "✅ Todos los checks SEO superados."

# ─────────────────────────────────────────────────────────────────────────────
# NOTA SOBRE EL DESPLIEGUE:
# El deploy a producción lo realiza automáticamente Netlify al detectar
# cambios en la rama 'main' mediante la integración Git configurada en
# netlify.toml. Este workflow SOLO ejecuta validaciones y NO necesita
# secrets (NETLIFY_AUTH_TOKEN, NETLIFY_SITE_ID, etc.).
# ─────────────────────────────────────────────────────────────────────────────
